<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Amii Trans</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="margin-bottom: 20px;">
            <img src="/assets/images/logo.png" alt="Amii Trans Logo" style="height: 52px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.45));">
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet Anda sedang terputus. Silakan periksa jaringan WiFi atau paket data Anda untuk melanjutkan akses ke Amii Trans.</p>
        <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
